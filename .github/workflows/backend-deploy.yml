name: Deploy Azure Backend

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Zip backend folder
        run: |
          cd backend
          zip -r backend.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8559CB1D87014339BB25E2748D2A92EE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A987B9D0746F46D4852A88E6362D2D6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19603E7406F048ACA7B3E64AF0882126 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'azure-todo-backend'
          slot-name: 'Production'
          package: backend/backend.zip
